name: Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r28c

      - name: Build and package
        run: |
          xmake f -y -p android -a arm64-v8a -m release --ndk=${{ steps.ndk.outputs.ndk-path }} --ndk_sdkver=28
          xmake -y

      - uses: actions/upload-artifact@v4
        with:
          name: AppleSkin-levipack
          path: build/android/arm64-v8a/release/AppleSkin.levipack
          if-no-files-found: error
